<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$NOTBOT Reclaimer</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: #161b22;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            border: 1px solid #30363d;
        }
        .btn {
            background: #7e6ce2;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
        }
        #status {
            margin-top: 20px;
            font-size: 0.9em;
            color: #8b949e;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ $NOTBOT Reclaimer</h2>
    <p>Connect your wallet to scan empty token accounts.</p>
    
    <button class="btn" onclick="connectPhantom()">🔗 Connect Phantom Wallet</button>
    <button class="btn" style="background:#21262d;" onclick="manualAddress()">📝 Enter Address Manually</button>
    
    <div id="status">Ready</div>
</div>

<script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
        tg.ready();
        tg.expand();
    }

    function setStatus(text) {
        document.getElementById('status').innerText = text;
    }

    async function connectPhantom() {
        setStatus("Opening Phantom...");
        
        // استخدام Deep Link لفتح التطبيق على الموبايل
        const currentUrl = encodeURIComponent(window.location.href);
        const phantomDeepLink = "https://phantom.app/ul/browse/" + currentUrl;
        
        if (tg) {
            tg.openLink(phantomDeepLink);
        } else {
            window.location.href = phantomDeepLink;
        }
    }

    function manualAddress() {
        const address = prompt("Paste your Solana Address:");
        if (address && address.length >= 32) {
            sendToBot(address.trim());
        }
    }

    function sendToBot(address) {
        setStatus("Submitting address...");
        if (tg) {
            // إرسال البيانات وإغلاق التطبيق فوراً
            tg.sendData(address);
            tg.close();
        } else {
            alert("Address: " + address);
        }
    }
</script>

</body>
</html>
