<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$NOTBOT Solana Reclaimer</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #f0f6fc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 1.5rem;
            color: #58a6ff;
            margin-bottom: 12px;
        }
        p {
            font-size: 0.9rem;
            color: #8b949e;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .btn {
            background: linear-gradient(135deg, #ab9ff2, #7e6ce2);
            color: #000;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            border-radius: 12px;
            padding: 14px 20px;
            width: 100%;
            cursor: pointer;
            transition: opacity 0.2s ease;
            margin-bottom: 12px;
        }
        .btn:active {
            opacity: 0.8;
        }
        .btn-secondary {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
        }
        .status-box {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            font-size: 0.85rem;
            color: #e6edf3;
            word-break: break-all;
            margin-top: 15px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>⚡ $NOTBOT Reclaimer</h1>
        <p>Connect your Solana wallet to scan and recover trapped SOL from closed token accounts.</p>

        <!-- زر الاتصال المباشر -->
        <button class="btn" onclick="connectWallet()">🔗 Connect Phantom Wallet</button>
        
        <!-- زر بديل للإرسال الفوري للتيليجرام -->
        <button class="btn btn-secondary" onclick="pasteAddressPrompt()">📝 Enter Address Manually</button>

        <div class="status-box" id="statusBox">
            Status: Ready to connect
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const statusBox = document.getElementById('statusBox');

        function setStatus(text) {
            statusBox.innerText = text;
        }

        async function connectWallet() {
            // 1. إذا كان المستخدم يفتح من متصفح كمبيوتر به إضافة Phantom
            if (window.solana && window.solana.isPhantom) {
                setStatus("Extension found. Requesting connection...");
                try {
                    const resp = await window.solana.connect();
                    const pubKey = resp.publicKey.toString();
                    setStatus("Connected: " + pubKey);
                    
                    if (tg) {
                        tg.sendData(pubKey);
                    }
                } catch (err) {
                    setStatus("Connection cancelled: " + err.message);
                }
                return;
            }

            // 2. إذا كان المستخدم داخل تطبيق تيليجرام الموبايل (استخدام Deep Link)
            setStatus("Redirecting to Phantom Mobile App...");
            
            const currentUrl = encodeURIComponent(window.location.href);
            const refUrl = encodeURIComponent(window.location.origin);
            const phantomDeepLink = "https://phantom.app/ul/browse/" + currentUrl + "?ref=" + refUrl;

            if (tg && tg.openLink) {
                tg.openLink(phantomDeepLink);
            } else {
                window.location.href = phantomDeepLink;
            }
        }

        function pasteAddressPrompt() {
            const address = prompt("Paste your Solana Public Key:");
            if (address && address.trim().length >= 32) {
                setStatus("Submitting address...");
                if (tg) {
                    tg.sendData(address.trim());
                } else {
                    alert("Address captured: " + address.trim());
                }
            } else if (address) {
                alert("Invalid Solana address format.");
            }
        }
    </script>
</body>
</html>
