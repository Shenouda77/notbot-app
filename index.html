<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOTBOT Solana Reclaimer</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      padding: 24px 16px;
      margin: 0;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h2 { color: #38bdf8; margin: 0 0 10px 0; font-size: 22px; }
    p { color: #94a3b8; font-size: 14px; line-height: 1.5; }
    .btn {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      color: #0f172a;
      border: none;
      font-weight: 700;
      font-size: 16px;
      padding: 14px 20px;
      border-radius: 12px;
      width: 100%;
      cursor: pointer;
      margin-top: 20px;
      transition: 0.2s ease;
    }
    .btn:active { transform: scale(0.98); }
    .status-box {
      margin-top: 15px;
      padding: 12px;
      background: #0f172a;
      border-radius: 8px;
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      color: #a5f3fc;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>🤖 $NOTBOT Reclaimer</h2>
    <p>Connect your Solana wallet (Phantom / Solflare) to scan and reclaim locked SOL rent.</p>
    
    <button class="btn" id="connectBtn" onclick="connectWallet()">🔗 Connect Wallet</button>
    <div id="status" class="status-box"></div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    async function connectWallet() {
      const statusDiv = document.getElementById('status');
      statusDiv.style.display = 'block';

      const provider = window.solana || window.solflare;

      if (provider) {
        try {
          const resp = await provider.connect();
          const walletAddress = resp.publicKey.toString();
          statusDiv.innerText = "Connected: " + walletAddress;
          
          tg.sendData(JSON.stringify({ action: "wallet_connected", wallet: walletAddress }));
          setTimeout(() => tg.close(), 1000);
        } catch (err) {
          statusDiv.innerText = "Connection error: " + err.message;
        }
      } else {
        statusDiv.innerText = "No Solana wallet detected. Please open within Phantom/Solflare in-app browser.";
      }
    }
  </script>
</body>
</html>
