<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Solana Rent Reclaimer</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        button { background: #ab9ff2; border: none; padding: 15px 30px; border-radius: 10px; font-size: 18px; cursor: pointer; color: black; font-weight: bold; margin: 10px; }
    </style>
</head>
<body>
    <h1>تأكيد استرداد الرنت</h1>
    <p id="status">اضغط للاتصال بالمحفظة أولاً</p>
    <button id="connectBtn">اتصال بالمحفظة</button>
    <button id="claimBtn" disabled>توقيع العملية الآن</button>

    <script>
        const connectBtn = document.getElementById('connectBtn');
        const claimBtn = document.getElementById('claimBtn');
        const status = document.getElementById('status');

        connectBtn.onclick = async () => {
            if (window.solana && window.solana.isPhantom) {
                try {
                    const resp = await window.solana.connect();
                    status.innerText = "متصل: " + resp.publicKey.toString().slice(0,8) + "...";
                    claimBtn.disabled = false;
                    connectBtn.style.display = 'none';
                } catch (err) { status.innerText = "فشل الاتصال: " + err.message; }
            } else {
                alert("يرجى فتح هذه الصفحة داخل تطبيق Phantom!");
            }
        };

        claimBtn.onclick = async () => {
            status.innerText = "جاري التوقيع...";
            alert("تم إرسال الطلب لمحفظة فانتوم... تأكد من ظهور نافذة البصمة.");
        };
    </script>
</body>
</html>
