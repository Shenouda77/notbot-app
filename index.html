<script>
    const walletInput = document.getElementById('walletAddress');
    const submitBtn = document.getElementById('submitBtn');
    const statusLog = document.getElementById('statusLog');

    const BOT_USERNAME = "NotBotReclaimerBot"; // ضع يوزر نيم البوت الخاص بك هنا بدون @

    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }

    submitBtn.addEventListener('click', () => {
        const address = walletInput.value.trim();

        if (!address || address.length < 32 || address.length > 44) {
            statusLog.innerText = "⚠️ يرجى إدخال عنوان محفظة سولانا صحيح.";
            statusLog.style.color = "#fbbf24";
            return;
        }

        statusLog.innerText = "⏳ جاري إرسال العنوان للبوت...";
        statusLog.style.color = "#38bdf8";

        // التوجيه الفوري للشات مع تمرير العنوان في الرابط
        const targetUrl = `https://t.me/${BOT_USERNAME}?start=scan_${address}`;
        
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openTelegramLink) {
            window.Telegram.WebApp.openTelegramLink(targetUrl);
        } else {
            window.location.href = targetUrl;
        }
    });
</script>
