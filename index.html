<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$NOTBOT Reclaimer</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0b0e14;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background: #151a23;
            border: 1px solid #232d3f;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h2 { margin: 0 0 8px; font-size: 20px; color: #38bdf8; }
        p { color: #94a3b8; font-size: 13px; line-height: 1.5; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 12px;
            background: #0b0e14;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            box-sizing: border-box;
            margin-bottom: 12px;
            text-align: center;
        }
        input:focus { outline: none; border-color: #38bdf8; }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-sizing: border-box;
        }
        .btn-scan { background: linear-gradient(135deg, #38bdf8, #2563eb); color: white; }
        .btn-phantom { background: #ab9ff2; color: #1a1b23; }
        .status-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background: #0b0e14;
            font-size: 12px;
            color: #94a3b8;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🤖 $NOTBOT Reclaimer</h2>
    <p>Reclaim trapped SOL rent from closed token accounts.</p>

    <!-- خانة لصق العنوان مباشرة -->
    <input type="text" id="walletInput" placeholder="Paste Solana Wallet Address" />

    <button class="btn btn-scan" id="scanBtn">🔍 Scan Recoverable SOL</button>
    <button class="btn btn-phantom" id="openPhantomBtn">🟣 Open In Phantom App</button>

    <div class="status-box" id="statusLog">Ready to scan...</div>
</div>

<script>
    const walletInput = document.getElementById('walletInput');
    const scanBtn = document.getElementById('scanBtn');
    const openPhantomBtn = document.getElementById('openPhantomBtn');
    const statusLog = document.getElementById('statusLog');

    const APP_URL = "https://shenouda77.github.io/notbot-app/";

    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }

    // زر الفحص المباشر
    scanBtn.addEventListener('click', () => {
        const address = walletInput.value.trim();
        if (!address || address.length < 32 || address.length > 44) {
            statusLog.innerText = "⚠️ Please enter a valid Solana address.";
            statusLog.style.color = "#fbbf24";
            return;
        }

        statusLog.innerText = "⏳ Scanning blockchain for empty token accounts...";
        statusLog.style.color = "#38bdf8";

        // إرسال العنوان للبوت في تيليجرام لمعالجته
        setTimeout(() => {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.sendData) {
                window.Telegram.WebApp.sendData(JSON.stringify({
                    action: "scan_wallet",
                    address: address
                }));
            } else {
                statusLog.innerText = "✅ Address validated: " + address.slice(0, 6) + "..." + address.slice(-4);
                statusLog.style.color = "#4ade80";
            }
        }, 800);
    });

    // زر التحويل المباشر لمتصفح فانتوم
    openPhantomBtn.addEventListener('click', () => {
        const phantomUrl = `https://phantom.app/ul/browse/${encodeURIComponent(APP_URL)}?ref=${encodeURIComponent(APP_URL)}`;
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openLink) {
            window.Telegram.WebApp.openLink(phantomUrl);
        } else {
            window.location.href = phantomUrl;
        }
    });
</script>

</body>
</html>
