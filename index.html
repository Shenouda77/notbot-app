<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$NOTBOT Multi-Wallet Reclaimer</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0b0e14;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background: #151a23;
            border: 1px solid #232d3f;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h2 { margin: 0 0 8px; font-size: 20px; color: #38bdf8; }
        p { color: #94a3b8; font-size: 13px; line-height: 1.5; margin-bottom: 20px; }
        
        .wallet-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-phantom { background: #ab9ff2; color: #1a1b23; }
        .btn-solflare { background: #fc7430; color: #ffffff; }
        .btn-backpack { background: #e33e38; color: #ffffff; }
        .btn-okx { background: #27272a; color: #ffffff; border: 1px solid #3f3f46; }
        .btn-direct { background: linear-gradient(135deg, #38bdf8, #2563eb); color: white; margin-top: 15px; }

        .status-box {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            background: #0b0e14;
            font-size: 12px;
            color: #94a3b8;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🤖 $NOTBOT Reclaimer</h2>
    <p>Select your Solana wallet to connect and reclaim locked SOL:</p>

    <!-- أزرار المحافظ المتعددة -->
    <button class="wallet-btn btn-phantom" onclick="openWallet('phantom')">🟣 Phantom</button>
    <button class="wallet-btn btn-solflare" onclick="openWallet('solflare')">🟠 Solflare</button>
    <button class="wallet-btn btn-backpack" onclick="openWallet('backpack')">🔴 Backpack</button>
    <button class="wallet-btn btn-okx" onclick="openWallet('okx')">⚫ OKX Wallet</button>

    <button class="wallet-btn btn-direct" onclick="checkInjectedWallet()">⚡ Direct Connect (In-App)</button>

    <div class="status-box" id="statusLog">Ready to connect...</div>
</div>

<script>
    const statusLog = document.getElementById('statusLog');
    const APP_URL = "https://shenouda77.github.io/notbot-app/";

    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }

    // فتح الرابط داخل المتصفح الداخلي لكل محفظة
    function openWallet(type) {
        let deepLink = "";
        const encodedUrl = encodeURIComponent(APP_URL);

        switch (type) {
            case 'phantom':
                deepLink = `https://phantom.app/ul/browse/${encodedUrl}?ref=${encodedUrl}`;
                break;
            case 'solflare':
                deepLink = `https://solflare.com/ul/v1/browse/${encodedUrl}?ref=${encodedUrl}`;
                break;
            case 'backpack':
                deepLink = `https://backpack.app/ul/browse/${encodedUrl}`;
                break;
            case 'okx':
                deepLink = `okx://wallet/dapp/url?dappUrl=${encodedUrl}`;
                break;
        }

        statusLog.innerText = `Opening ${type.toUpperCase()}...`;

        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openLink) {
            window.Telegram.WebApp.openLink(deepLink);
        } else {
            window.location.href = deepLink;
        }
    }

    // التحقق من المحفظة إذا فُتحت الصفحة بالفعل داخل متصفح أي محفظة
    async function checkInjectedWallet() {
        const provider = window.phantom?.solana || window.solflare || window.solana;
        if (provider) {
            try {
                statusLog.innerText = "Connecting...";
                const res = await provider.connect();
                const pubKey = (res.publicKey || provider.publicKey).toString();
                statusLog.innerText = "✅ Connected: " + pubKey.slice(0, 6) + "..." + pubKey.slice(-4);
                statusLog.style.color = "#4ade80";

                if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.sendData) {
                    window.Telegram.WebApp.sendData(JSON.stringify({
                        action: "wallet_connected",
                        address: pubKey
                    }));
                }
            } catch (e) {
                statusLog.innerText = "❌ Connection cancelled.";
                statusLog.style.color = "#f87171";
            }
        } else {
            statusLog.innerText = "⚠️ Please choose a wallet button above to open its app.";
            statusLog.style.color = "#fbbf24";
        }
    }

    window.addEventListener('load', () => {
        if (window.phantom?.solana || window.solflare || window.solana) {
            checkInjectedWallet();
        }
    });
</script>

</body>
</html>
